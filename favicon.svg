<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- iOS Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="256" rx="115" fill="url(#glossGrad)"/>

  <!-- Magic Sparkles & Wand Icon -->
  <g fill="#ffffff">
    <!-- Star 1 (Top Center-Right Large) -->
    <path d="M370 70 c0 35 25 60 60 60 c-35 0 -60 25 -60 60 c0 -35 -25 -60 -60 -60 c35 0 60 -25 60 -60 Z" />
    
    <!-- Star 2 (Small Left) -->
    <path d="M140 110 c0 22 15 38 38 38 c-22 0 -38 15 -38 38 c0 -22 -15 -38 -38 -38 c22 0 38 -15 38 -38 Z" />

    <!-- Star 3 (Right Bottom) -->
    <path d="M410 270 c0 20 14 34 34 34 c-20 0 -34 14 -34 34 c0 -20 -14 -34 -34 -34 c20 0 34 -14 34 -34 Z" />

    <!-- Wand Body & Tip -->
    <g transform="rotate(-45 230 290)">
      <!-- Wand Handle & Shaft -->
      <rect x="214" y="160" width="32" height="260" rx="16" fill="#ffffff" opacity="0.95"/>
      <!-- Wand Glowing Tip -->
      <rect x="214" y="110" width="32" height="60" rx="10" fill="#ffffff"/>
      <circle cx="230" cy="110" r="24" fill="#ffffff"/>
    </g>
  </g>
</svg>

